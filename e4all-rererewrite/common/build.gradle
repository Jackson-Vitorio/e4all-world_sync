architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}") {
        exclude(group: "io.netty")
    }
    implementation 'folk.sisby:kaleido-config:0.3.3+1.3.2'
    implementation("io.netty:netty-all:4.2.9.Final")
    implementation("link.e4mc:iroh-java:${rootProject.iroh_java_version}")
    
    // GitHub World Sync dependencies
    implementation "org.eclipse.jgit:org.eclipse.jgit:6.5.0.202303070854-r"
    implementation "org.kohsuke:github-api:2.0-rc.3"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.13.4"
}

configurations {
    consumable("unstubbedJar")
}

tasks.register('unstubbedJar', Jar) {
    archiveClassifier = 'unstubbed'

    from zipTree(jar.archiveFile)
    exclude("link/e4mc/Agnos.class")
}

tasks.register('unstubbedSourcesJar', Jar) {
    archiveClassifier = 'unstubbed-sources'

    from zipTree(jar.archiveFile)
    exclude("link/e4mc/Agnos.java")
}

artifacts {
    add("unstubbedJar", unstubbedJar)
}





